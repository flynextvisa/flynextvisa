<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e2b;--card:#151a42;--txt:#eef0ff;--mut:#a6abd6;--line:#2a2f66;--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b0e2b;--card:#151a42;--txt:#eef0ff;--mut:#a6abd6;--line:#2a2f66;--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Tajawal',system-ui,sans-serif;line-height:1.7}
.wrap{max-width:780px;margin:auto;padding:0 16px}
header{background:var(--g);color:#fff;padding:14px 0 90px;position:relative;overflow:hidden}
header::before,header::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
header::before{width:300px;height:300px;top:-110px;inset-inline-end:-80px}
header::after{width:200px;height:200px;bottom:-90px;inset-inline-start:-50px}
.bar{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.logo{font-size:26px;font-weight:800;direction:ltr}
.logo span{background:rgba(255,255,255,.2);border-radius:10px;padding:1px 9px;font-size:15px;margin-left:6px}
.tools{display:flex;gap:8px}
.tl{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:5px 14px;font-family:inherit;font-weight:700;cursor:pointer;font-size:14px}
.hero{text-align:center;padding:34px 0 0;position:relative;z-index:1}
.plane{font-size:44px;display:inline-block;animation:fl 3.5s ease-in-out infinite}
@keyframes fl{50%{transform:translate(8px,-10px) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.plane{animation:none}}
.hero h1{margin:6px 0;font-size:32px}.hero p{margin:0 0 20px;opacity:.92}
.cta{display:inline-block;background:#fff;color:var(--navy);font-weight:800;border-radius:30px;padding:11px 30px;text-decoration:none}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:-40px 0 18px;position:relative;z-index:2}
.st{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:10px 4px;text-align:center;font-size:13px;font-weight:700}
.st i{display:block;width:26px;height:26px;line-height:26px;margin:0 auto 4px;border-radius:50%;background:var(--g);color:#fff;font-style:normal}
#f{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--sh);margin-bottom:30px;scroll-margin-top:12px}
.pg{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:6px}
.pg div{height:100%;width:0;background:var(--g);transition:width .4s}
h3{margin:20px 0 8px;font-size:17px;color:var(--pur)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 2px;font-family:inherit;font-weight:700;font-size:14px;color:var(--txt);cursor:pointer;transition:.2s}
.tab:hover{border-color:var(--pur)}.tab b{display:block;font-size:24px}
.tab.on{border-color:transparent;background:var(--g);color:#fff;transform:translateY(-2px)}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:15px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--txt);font-family:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pur);box-shadow:0 0 0 3px rgba(107,33,168,.2)}
textarea{min-height:90px}.ltr{direction:ltr;text-align:left}input[type=date],input[type=month]{min-height:50px;direction:ltr;text-align:start;accent-color:#6b21a8;cursor:pointer}:root[data-theme="dark"]{color-scheme:dark}:root[data-theme="light"]{color-scheme:light}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
.send{width:100%;margin-top:20px;background:var(--g);color:#fff;border:0;border-radius:14px;padding:14px;font-family:inherit;font-weight:800;font-size:17px;cursor:pointer}
.send:hover{filter:brightness(1.1)}
.note{font-size:14px;color:var(--mut);text-align:center;margin:12px 0 0}.hint{color:var(--mut);font-size:14px;margin:0}
.err{color:var(--mag);font-weight:700}
.ok{text-align:center;padding:20px 0}.ok h2{margin:0 0 6px}.ok .send{width:auto;padding:11px 26px}
footer{text-align:center;color:var(--mut);font-size:14px;padding:0 0 30px}
@media(max-width:480px){.tab,.st{font-size:12px}.hero h1{font-size:26px}}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.tab b .i{margin-bottom:2px}.okic{color:var(--pur)}.okic .i{stroke-width:1.6}.tl .i{display:block}
</style>
</head>
